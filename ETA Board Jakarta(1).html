:root{

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

html[lang="ko"] h1,html[lang="ko"] h2{letter-spacing:0}
header{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end}

h1{font-size:clamp(2rem,5vw,3.1rem);line-height:1;text-wrap:balance}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:0}
.clock{text-align:right}
.clock .num{font-size:2.2rem;line-height:1}

.fresh{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.chip{border:1px solid var(--line);background:var(--surface);padding:9px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);padding:12px 14px}

a.kpi:hover{border-color:var(--accent)}

a.kpi::after{content:"\2193";position:absolute;right:12px;top:10px;font-family:var(--mono);color:var(--muted)}
a.kpi:hover::after{color:var(--accent)}
.kpi .num{font-size:2.4rem;line-height:1}
section{scroll-margin-top:16px}

.gl-stage .vsub,.gl-stage .legend{color:#9fc3d6}

.gl-ctrl button[aria-pressed="true"]{background:#35c6ff;color:#03202f;border-color:#35c6ff}

.route{display:flex;flex-direction:column;gap:4px}

.route .ends b{color:var(--ink);font-weight:600}
dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:0}
dl div{min-width:0}
dt{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border:1px solid currentColor;border-radius:99px;white-space:nowrap}

.alerts{display:flex;flex-direction:column;gap:8px}

.panel{background:var(--surface);border:1px solid var(--line);padding:14px}
.scroll{overflow-x:auto}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.78rem;color:var(--muted);margin-top:8px}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);max-width:100%}
.seg button{font:inherit;background:var(--surface);color:var(--ink);border:0;padding:6px 14px;cursor:pointer}

.lang button{padding:5px 12px;font-size:.82rem}

table{border-collapse:collapse;width:100%;min-width:980px;background:var(--surface)}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}

</style>

function alertsFor(now){
  var A=[],h=36e5;
  VESSELS.forEach(function(v){
    var n=esc(v.name+' '+v.voy), tm=esc(v.term.name);
    var nx=ms(v.next.eta);
    if(v.phase==='waiting_other'&&nx&&nx<now)
      A.push({sev:'bad',tag:S.tg.last,txt:S.a_last(n,esc(aisSt(v.ais.status).toLowerCase()),esc(areaT(v.ais.area)),dur((now-nx)/h),esc(pn(v.next)),dt(v.next.eta),esc(pn(v.last)),dt(v.last.atd))});
    if(v.phase==='enroute_jkt'){
      var te=ms(v.term.eta);
      if(te&&te<now)A.push({sev:'warn',tag:S.tg.web,txt:S.a_web(n,tm,dt(v.term.eta),dt(v.next.eta))});
      var ee=ms(v.jkt.eta),ae=ms(v.next.eta);
      if(ee&&ae&&Math.abs(ae-ee)>=6*h)A.push({sev:'warn',tag:S.tg.src,txt:S.a_src(n,dt(v.jkt.eta),dt(v.next.eta),dur((ae-ee)/h))});
      var tb=ms(v.term.berth),eb=ms(v.jkt.etb);
      if(tb&&eb&&Math.abs(tb-eb)>=6*h)A.push({sev:'info',tag:S.tg.etb,txt:S.a_etb(n,tm,dt(v.term.berth),dt(v.jkt.etb),dur((tb-eb)/h))});
      var cl=ms(v.term.closing);
      if(cl&&ae&&cl<ae)A.push({sev:'info',tag:S.tg.clo,txt:S.a_clo(n,tm,dt(v.term.closing),dt(v.next.eta))});
    }else{
      var tb2=ms(v.term.berth),eb2=ms(v.jkt.etb);
      if(tb2&&eb2&&Math.abs(tb2-eb2)>=6*h)A.push({sev:'warn',tag:S.tg.etb,txt:S.a_etb(n,tm,dt(v.term.berth),dt(v.jkt.etb),dur((tb2-eb2)/h))});
    }
    var aa=ms(v.ais.at);
    if(aa&&now-aa>4*h)A.push({sev:'info',tag:S.tg.ais,txt:S.a_ais(n,ago(v.ais.at,now))});
  });
  var em=ms(META.emailAt);
  if(em&&now-em>48*36e5)A.push({sev:'warn',tag:S.tg.mail,txt:S.a_mail(dt(META.emailAt),dur((now-em)/36e5))});
  var ord={bad:0,warn:1,info:2};A.sort(function(a,b){return ord[a.sev]-ord[b.sev]});
  return A;
}

  '선사별은 RBM 기준으로 SKR과 HAL(HAS) 화물을 구분합니다. 모든 수치는 박스 단위입니다. 무브 계획은 PORT MEETING RESULT 이메일 기준입니다.',
  '잔여는 최신 잔여 화물 이메일의 전체 크레인 잔여 박스 합계이며, 출항한 선박은 0입니다.']}
};
function RS(){return JR[LANG]||JR.id}
function jn(x){var n=parseInt(String(x==null?'':x).replace(/[^0-9]/g,''),10);return isNaN(n)?null:n}
function fN(n){return n==null?'-':Number(n).toLocaleString(LOCALE[LANG]||'id-ID')}
function jCbfT(v){var p=v.planLoad||[];return p.length?p.reduce(function(a,x){return a+(jn(x.boxes)||0)},0):null}
function jPre(v){return v.preplan?jn(v.preplan.boxes):null}
function jPlanT(v){var p=jPre(v);return p!=null?p:jCbfT(v)}
function jPlanD(v){return v.planDisch?jn(v.planDisch.boxes):null}
function jMissing(v){var have={};(v.planLoad||[]).forEach(function(x){have[x.line]=1});return ['SKR','HAL'].filter(function(l){return !have[l]})}
function jLines(v){
  var L=(v.rbm||{}).lines||[],R=RS();
  return L.map(function(x){return '<span class="sub">'+esc(x.line)+' '+R.d+' '+esc(x.disch)+' · '+R.l+' '+esc(x.load)+'</span>'}).join('')+(L.length?'<span class="sub" style="font-family:var(--body)">RBM '+dt(v.rbm.at)+'</span>':'');
}
function jPlanCell(v){
  var R=RS(),B='style="font-family:var(--body)"',pd=jPlanD(v),pre=jPre(v),cbf=v.planLoad||[],mp=jn(v.pm&&v.pm.moves),h='';
  h+='<span class="sub" '+B+'>'+esc(R.pb)+'</span>';
  h+=pd!=null?'<b>'+fN(pd)+'</b> '+esc(R.box)+(v.planDisch.rob!=null?'<span class="sub">'+esc(R.rob)+' '+fN(jn(v.planDisch.rob))+'</span>':'')+'<span class="sub" '+B+'>'+esc(R.srcDis)+' '+dt(v.planDisch.at)+'</span>'
    :'<span class="sub">'+esc(R.noMail)+'</span>';
  h+='<span class="sub" style="font-family:var(--body);margin-top:6px">'+esc(R.pm)+'</span>';
  if(pre!=null){
    var p=v.preplan,ex=[];
    if(p.rf!=null)ex.push('RF '+fN(jn(p.rf)));if(p.dg!=null)ex.push('DG '+fN(jn(p.dg)));if(p.restow!=null)ex.push('restow '+fN(jn(p.restow)));
    h+='<b>'+fN(pre)+'</b> '+esc(R.box)+(ex.length?'<span class="sub">'+esc(ex.join(' · '))+'</span>':'')+'<span class="sub" '+B+'>'+esc(R.srcPre)+' '+dt(p.at)+'</span>';
  }else if(cbf.length){
    var last=cbf.reduce(function(a,x){return x.at>a?x.at:a},'');
    h+='<b>'+fN(jCbfT(v))+'</b> '+esc(R.box)+cbf.map(function(x){return '<span class="sub">'+esc(x.line)+' '+fN(jn(x.boxes))+(x.teus?' · '+fN(jn(x.teus))+' TEU':'')+'</span>'}).join('')+
     jMissing(v).map(function(l){return '<span class="sub"><span class="warn">'+esc(R.noLine(l))+'</span></span>'}).join('')+
     '<span class="sub" '+B+'><span class="warn">'+esc(R.srcCbf)+'</span> · '+dt(last)+'</span>';
  }else h+='<span class="sub">'+esc(R.noMail)+'</span>';
  if(mp!=null)h+='<span class="sub" '+B+'>'+esc(R.mp)+' '+fN(mp)+'</span>';
  return h;
}
function jHead(){
  var R=RS(),M=JKT.meta||{};
  document.getElementById('pg-h1').textContent=R.h1;
  document.getElementById('pg-sub').textContent=R.sub;
  document.getElementById('pg-upd').textContent=R.upd(dt(M.syncedAt));
}
function rkRow(v){
  var d=jn(v.disch),l=jn(v.load),open=d==null&&l==null;
  return {v:v,d:d,l:l,t:open?null:(d||0)+(l||0),mp:jn(v.pm&&v.pm.moves),pl:jPlanT(v),pd:jPlanD(v),bal:v.atd?0:(v.balance?jn(v.balance.total):null),open:open};
}
function rkSum(R){
  var s={n:R.length,d:0,l:0,t:0,mp:null,pl:null,pd:null,bal:0,open:0,plN:0,pdN:0,rbmN:0,line:{}};
  R.forEach(function(r){
    if(r.open)s.open++;else{s.d+=r.d||0;s.l+=r.l||0;s.t+=r.t||0}
    if(r.mp!=null)s.mp=(s.mp||0)+r.mp;
    if(r.pl!=null){s.pl=(s.pl||0)+r.pl;s.plN++}
    if(r.pd!=null){s.pd=(s.pd||0)+r.pd;s.pdN++}
    s.bal+=r.bal||0;
    var L=(r.v.rbm||{}).lines||[];if(L.length)s.rbmN++;
    L.forEach(function(x){var o=s.line[x.line]=s.line[x.line]||{d:0,l:0};o.d+=jn(x.disch)||0;o.l+=jn(x.load)||0});
  });
  return s;
}
function rkData(now,per){
  var P=per==null?RPER:per;
  var V=(JKT.vessels||[]).filter(function(v){if(!P)return true;var a=ms(v.ata||v.atb||(v.pm&&v.pm.eta));return a==null||now-a<=P*864e5});
  var order=['PCI','PCI2','KI1','ANX'],by={};
  V.forEach(function(v){var k=v.svc||'-';(by[k]=by[k]||[]).push(rkRow(v))});
  var keys=Object.keys(by).sort(function(a,b){var i=order.indexOf(a),j=order.indexOf(b);return ((i<0?99:i)-(j<0?99:j))||a.localeCompare(b)});
  var all=[];keys.forEach(function(k){all=all.concat(by[k])});
  return {keys:keys,by:by,all:all};
}
function rkLineTxt(s,n){
  var R=RS(),ks=Object.keys(s.line).sort().reverse();
  if(!ks.length)return '';
  return ks.map(function(k){return k+' '+R.d+' '+fN(s.line[k].d)+' / '+R.l+' '+fN(s.line[k].l)}).join(' · ')+(s.rbmN<n?' ('+R.cover(s.rbmN,n)+')':'');
}
function rkCov(v,k,n){return v!=null&&k<n?'<span class="sub" style="font-family:var(--body)">'+esc(RS().cover(k,n))+'</span>':''}
function rkCells(s){
  var open=s.open===s.n;
  return '<td class="n">'+(open?'-':fN(s.d))+'</td><td class="n">'+(open?'-':fN(s.l))+'</td><td class="n">'+(open?'-':fN(s.t))+'</td>'+
   '<td class="n">'+fN(s.pd)+rkCov(s.pd,s.pdN,s.n)+'</td><td class="n">'+fN(s.pl)+rkCov(s.pl,s.plN,s.n)+'</td>'+
   '<td class="n">'+fN(s.mp)+'</td><td class="n">'+fN(s.bal)+'</td><td><span class="sub" style="color:inherit">'+esc(rkLineTxt(s,s.n)||'-')+'</span></td>';
}
function rkText(D,now){
  var R=RS(),M=JKT.meta||{},out=[R.rTitle,R.rData(dt(M.syncedAt),R.pTxt(RPER)),''];
  var plans=function(o){return (o.pd!=null?' · '+R.rPlanD+' '+fN(o.pd):'')+(o.pl!=null?' · '+R.rPlan+' '+fN(o.pl):'')};
  D.keys.forEach(function(k){
    var s=rkSum(D.by[k]),op=s.open===s.n;
    out.push(R.rSvc(k,s.n,op?'-':fN(s.d),op?'-':fN(s.l),op?'-':fN(s.t))+plans(s)+(s.bal?' · '+R.rBal+' '+fN(s.bal):''));
    D.by[k].forEach(function(r){
      var v=r.v,st=(JS().st||{})[v.status]||v.status||'';
      out.push('  - '+v.name+' '+v.voy+' ('+v.op+', '+(v.term||'-')+', '+st+'): '+(r.open?R.run+(r.mp!=null?', '+R.mp+' '+fN(r.mp):'')+(r.bal!=null?', '+R.rBal+' '+fN(r.bal):''):R.d+' '+fN(r.d)+' / '+R.l+' '+fN(r.l)+' = '+fN(r.t))+plans(r));
    });
  });
  var g=rkSum(D.all);
  out.push('');
  out.push(R.rSvc(R.grand,g.n,fN(g.d),fN(g.l),fN(g.t)));
  ['SKR','HAL'].forEach(function(o){var s=rkSum(D.all.filter(function(r){return r.v.op===o}));if(s.n)out.push(R.rSvc(R.opr(o),s.n,fN(s.d),fN(s.l),fN(s.t)))});
  var lt=rkLineTxt(g,g.n);if(lt)out.push(R.th[8]+': '+lt);
  if(g.open)out.push(R.openN(g.open));
  return out.join('\n');
}
function jKpis(now){
  var R=RS(),V=JKT.vessels||[];
  var W=V.filter(function(v){return v.balance&&!v.atd}).sort(function(a,b){return (ms(a.balance.estDepart)||0)-(ms(b.balance.estDepart)||0)});
  var bal=W.reduce(function(a,v){return a+(jn(v.balance.total)||0)},0),here=V.filter(function(v){return !v.atd}).length;
  var D=rkData(now,0),g=rkSum(D.all);
  var k=[
   [W.length?fN(bal):'-',R.kBal,W.length?R.kBalS(W[0].name,dt(W[0].balance.estDepart)):R.kBalNone,'hot','sec-jkt'],
   [fN(V.length),R.kBm,R.kBmS(here,V.length),'','sec-bm'],

}
function jRekap(now){
  var R=RS(),D=rkData(now),g=rkSum(D.all);
  document.getElementById('rk-h').textContent=R.h;
  document.getElementById('rk-hs').textContent=R.hs(g.n,R.pTxt(RPER));
  document.getElementById('rk-th').innerHTML=R.th.map(function(t,i){return '<th'+(i>0&&i<8?' class="n"':'')+'>'+esc(t)+'</th>'}).join('');

    rows.forEach(function(r){
      var v=r.v,one=rkSum([r]);
      html+='<tr class="ves"><td><span class="nm">'+esc(v.name)+'</span> <span class="mono">'+esc(v.voy)+'</span><span class="sub">'+esc(v.op)+' · '+esc(v.term||'-')+' · '+esc((JS().st||{})[v.status]||v.status||'')+(r.open?' · '+esc(R.run):'')+'</span></td>'+rkCells(one)+'</tr>';
    });
  });
  if(D.all.length){
    html+='<tr class="tot"><td>'+esc(R.grand)+' <span class="sub" style="display:inline;font-weight:400">· '+esc(R.nVes(g.n))+'</span></td>'+rkCells(g)+'</tr>';
    ['SKR','HAL'].forEach(function(o){var rows=D.all.filter(function(r){return r.v.op===o});if(rows.length){var s=rkSum(rows);html+='<tr class="opr"><td>'+esc(R.opr(o))+' <span class="sub" style="display:inline">· '+esc(R.nVes(s.n))+'</span></td>'+rkCells(s)+'</tr>'}});
  }else html='<tr><td colspan="9">'+esc(R.noMail)+'</td></tr>';
  document.getElementById('rk-rows').innerHTML=html;
  document.getElementById('rk-notes').innerHTML=(g.open?['<li><b>'+esc(R.openN(g.open))+'.</b></li>']:[]).concat(R.notes.map(function(x){return '<li>'+esc(x)+'</li>'})).join('');
}
function rkGo(e){

/* ===== Tampilan: hero bertema pelayaran (dua kapal kontainer dengan nama line di lambung) dan navigasi bagian ===== */
function heroScene(){
  var el=document.getElementById('scene');if(!el)return;
  var W=1200,H=250,wl=206,pal=['#d4562a','#2a79ad','#e0a23a','#2f8f6b','#93a3ad','#b3372f','#4a90c2','#c9ced2'];
  var q=11;function rnd(){q=(q*16807)%2147483647;return q/2147483647}
  var DT='font-family:var(--display);font-weight:700;fill:#fff;';
  function crane(cx){
    return '<path d="M'+cx+' '+wl+'V'+(wl-118)+'M'+(cx+34)+' '+wl+'V'+(wl-118)+'M'+(cx-44)+' '+(wl-118)+'H'+(cx+112)+'M'+(cx-44)+' '+(wl-118)+'L'+(cx+17)+' '+(wl-158)+'L'+(cx+112)+' '+(wl-118)+'M'+cx+' '+(wl-58)+'H'+(cx+34)+'M'+(cx+17)+' '+(wl-158)+'V'+(wl-118)+'"/>';
  }
  function ship(x,L,name,code,hull){
    var top=wl-44,s='',bx=x+98,bw=27,gap=3,n=Math.floor((L-104)/(bw+gap));
    for(var i=0;i<n;i++){
      var tiers=3+Math.floor(rnd()*3);if(i<1||i>n-2)tiers=3;
      for(var t=0;t<tiers;t++)s+='<rect x="'+(bx+i*(bw+gap))+'" y="'+(top-13*(t+1))+'" width="'+bw+'" height="12" fill="'+pal[Math.floor(rnd()*pal.length)]+'"/>';
    }
    s+='<rect x="'+(x+30)+'" y="'+(top-74)+'" width="50" height="74" fill="#e9eef1"/>';
    for(var r=0;r<4;r++)s+='<rect x="'+(x+35)+'" y="'+(top-66+r*15)+'" width="40" height="4" fill="#0b2a3f"/>';
    s+='<rect x="'+(x+22)+'" y="'+(top-80)+'" width="66" height="6" fill="#cfd8dd"/>';
    s+='<rect x="'+(x+40)+'" y="'+(top-106)+'" width="28" height="26" fill="'+hull+'"/>';
    s+='<text x="'+(x+54)+'" y="'+(top-88)+'" text-anchor="middle" style="'+DT+'font-size:12px;letter-spacing:.5px">'+code+'</text>';
    s+='<path d="M'+x+' '+top+'H'+(x+L+38)+'L'+(x+L+10)+' '+wl+'H'+(x+12)+'L'+x+' '+(wl-14)+'Z" fill="'+hull+'"/>';
    s+='<path d="M'+(x+4)+' '+(wl-9)+'H'+(x+L+19)+'L'+(x+L+10)+' '+wl+'H'+(x+12)+'Z" fill="#06131d" fill-opacity=".6"/>';
    s+='<text x="'+(x+L*0.56)+'" y="'+(wl-17)+'" text-anchor="middle" style="'+DT+'font-size:26px;letter-spacing:5px">'+name+'</text>';
    return s;
  }
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Kapal kontainer SINOKOR dan HEUNG-A di depan crane pelabuhan">';
  s+='<g stroke="#a3c3d4" stroke-opacity=".3" stroke-width="3" fill="none" stroke-linecap="square">'+crane(548)+crane(1010)+'</g>';
  s+='<g stroke="#a3c3d4" stroke-opacity=".18" stroke-width="3" fill="none" stroke-linecap="square">'+crane(232)+'</g>';
  s+=ship(40,430,'SINOKOR','SKR','#c9481f')+ship(690,430,'HEUNG-A','HAL','#1c6fa3');
  s+='<rect x="0" y="'+wl+'" width="'+W+'" height="'+(H-wl)+'" fill="#04121d"/>';
  s+='<g stroke="#a3c3d4" stroke-opacity=".28" stroke-width="2" fill="none" stroke-linecap="round"><path d="M20 '+(wl+10)+'H150M230 '+(wl+18)+'H520M560 '+(wl+9)+'H640M700 '+(wl+20)+'H990M1040 '+(wl+11)+'H1180M90 '+(wl+30)+'H300M610 '+(wl+32)+'H820"/></g>';
  s+='</svg>';
  el.innerHTML=s;
}
